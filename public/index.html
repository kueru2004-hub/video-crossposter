<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動画同時投稿ツール</title><link rel="stylesheet" href="/app.css"></head><body><main><p class="eyebrow">VIDEO CROSSPOSTER</p><h1>動画同時投稿ツール</h1><p class="lead">1本のMP4をYouTubeとTikTokへ投稿します。</p><section><h2>1. 接続</h2><div class="buttons"><a href="/auth/youtube">YouTubeを接続</a><a href="/auth/tiktok">TikTokを接続</a></div><p id="status">確認中…</p></section><section><h2>2. 投稿</h2><form id="f"><label>動画<input id="v" type="file" accept="video/mp4" required></label><label>タイトル<input id="t" maxlength="100" required></label><label>説明文・ハッシュタグ<textarea id="d" rows="5"></textarea></label><fieldset><legend>投稿先</legend><label><input name="x" type="checkbox" value="youtube" checked>YouTube</label><label><input name="x" type="checkbox" value="tiktok" checked>TikTok</label></fieldset><div class="grid"><label>YouTube公開範囲<select id="yp"><option value="private">非公開</option><option value="unlisted">限定公開</option><option value="public">公開</option></select></label><label>TikTok公開範囲<select id="tp"><option value="SELF_ONLY">自分のみ</option><option value="PUBLIC_TO_EVERYONE">公開</option></select></label></div><button>選択先へ投稿</button></form><pre id="r"></pre></section><footer><a href="/privacy">プライバシーポリシー</a><a href="/terms">利用規約</a></footer></main><script>const $=s=>document.querySelector(s);fetch('/api/status').then(r=>r.json()).then(s=>$('#status').textContent=`YouTube: ${s.connected.youtube?'接続済み':'未接続'} / TikTok: ${s.connected.tiktok?'接続済み':'未接続'}`);$('#f').onsubmit=async e=>{e.preventDefault();const q=new URLSearchParams({title:$('#t').value,description:$('#d').value,targets:[...document.querySelectorAll('[name=x]:checked')].map(x=>x.value).join(','),yp:$('#yp').value,tp:$('#tp').value});$('#r').textContent='投稿中…';try{const x=await fetch('/api/publish?'+q,{method:'POST',headers:{'content-type':'video/mp4'},body:$('#v').files[0]}),text=await x.text();let d;try{d=JSON.parse(text)}catch{if(x.status===413)throw Error('動画の容量が大きすぎます。32MB未満に圧縮してから再度お試しください。');throw Error('サーバーエラー ('+x.status+')。時間を置いて再度お試しください。')}if(!x.ok)throw Error(d.error||'投稿失敗 ('+x.status+')');document.querySelector('#r').textContent=JSON.stringify(d,null,2)}catch(x){$('#r').textContent='エラー: '+x.message}};</script></body></html>
